<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joacă pe telefon</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1420; color: #fff; font-family: "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 34px; margin: 0 0 8px; } p { font-size: 20px; margin: 6px 0; opacity: .9; }
  #qr { background: #fff; padding: 18px; border-radius: 14px; margin: 18px 0; }
  .addr { font-size: 26px; font-weight: 800; color: #ffd84a; }
</style></head>
<body>
  <h1>📱 Joacă pe telefon</h1>
  <p>1. Deschide <b>camera</b> telefonului.</p>
  <p>2. Ține-o îndreptată spre codul de mai jos.</p>
  <p>3. Apasă pe linkul care apare.</p>
  <div id="qr"></div>
  <p>Sau scrie în Chrome pe telefon: <span class="addr" id="addr"></span></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // implicit: jocul de pe internet (GitHub Pages, merge ca aplicatie PWA);
    // cu ?ip=... arata adresa laptopului din Wi-Fi-ul de acasa
    const ip = new URLSearchParams(location.search).get('ip');
    const url = ip ? 'http://' + ip + ':8123' : 'https://paulduna.github.io/joc-fotbal/';
    document.getElementById('addr').textContent = url.replace(/^https?:\/\//, '');
    new QRCode(document.getElementById('qr'), { text: url, width: 300, height: 300 });
  </script>
</body></html>
